
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>Cardápio | Gold Bolos</title>

    <link
        rel="preload"
        href="fonts/GreatVibes-Regular.ttf"
        as="font"
        type="font/ttf"
        crossorigin
    >

    <link
        rel="preload"
        href="fonts/Montserrat-Regular.ttf"
        as="font"
        type="font/ttf"
        crossorigin
    >

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="brilhos brilhos-esquerda" aria-hidden="true"></div>
    <div class="brilhos brilhos-direita" aria-hidden="true"></div>

    <main class="pagina-cardapio">

        <a
            href="index.html"
            class="voltar-inicio"
            aria-label="Voltar à página inicial"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
            </svg>

            <span>VOLTAR</span>
        </a>

        <header class="cardapio-apresentacao">

            <div class="detalhe-superior" aria-hidden="true">
                <span></span>
                <span class="estrela">✦</span>
                <span></span>
            </div>

            <h1 class="titulo-cardapio">Nosso cardápio</h1>

            <p class="instrucao-cardapio">
                CLIQUE NA FOTO PARA VER OS DETALHES
            </p>

        </header>

        <section class="lista-produtos" aria-label="Bolos no pote">

            <!-- SABOR 1 -->
            <button
                class="produto-vitrine"
                type="button"
                data-sabor="Sabor 1"
                data-descricao="Descrição do sabor em breve."
                aria-label="Ver detalhes do sabor 1"
            >
                <span class="imagem-vitrine" aria-hidden="true">
                    <span class="foto-provisoria">
                        <span class="estrela-foto">✦</span>
                        <span>FOTO EM BREVE</span>
                    </span>
                </span>

                <span class="nome-vitrine">Nome do sabor</span>
                <span class="preco-vitrine">Preço em breve</span>
            </button>

                <span class="imagem-vitrine" aria-hidden="true">

                    </span>
                </span>

                <span class="nome-vitrine">Nome do sabor</span>

                <span class="imagem-vitrine" aria-hidden="true">

        <div class="area-botao cardapio-area-instagram">

            <a
                href="https://www.instagram.com/goldbolos_/"
                class="botao-cardapio botao-instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Pedir pelo Instagram da Gold Bolos"
            >
                <svg
                    class="icone-instagram"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <rect x="2" y="2" width="20" height="20" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle
                        cx="17.5"
                        cy="6.5"
                        r="1"
                        fill="currentColor"
                        stroke="none"
                    ></circle>
                </svg>

                PEDIR PELO INSTAGRAM
            </a>

        </div>

    </main>

    <dialog
        class="janela-sabor"
        id="janela-sabor"
        aria-labelledby="titulo-janela"
        aria-describedby="descricao-janela"
    >

        <div class="detalhes-sabor">

            <h2 id="titulo-janela">Sabor 1</h2>

            <div class="imagem-janela" aria-hidden="true">
                <span class="foto-provisoria">
                    <span class="estrela-foto">✦</span>
                    <span>FOTO EM BREVE</span>
                </span>
            </div>

            <p id="descricao-janela">
                Descrição do sabor em breve.
            </p>

            <span class="dica-fechar">
                Toque ou clique para fechar
            </span>

        </div>

    </dialog>
