<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>Cardápio | Gold Bolos</title>

    <link
        rel="preload"
        href="fonts/GreatVibes-Regular.ttf"
        as="font"
        type="font/ttf"
        crossorigin
    >

    <link
        rel="preload"
        href="fonts/Montserrat-Regular.ttf"
        as="font"
        type="font/ttf"
        crossorigin
    >

    <!-- CARREGAMENTO ANTECIPADO DAS 5 FOTOS -->
    <link rel="preload" as="image" href="img/sabor1.png">
    <link rel="preload" as="image" href="img/sabor2.png">
    <link rel="preload" as="image" href="img/sabor3.png">
    <link rel="preload" as="image" href="img/sabor4.png">
    <link rel="preload" as="image" href="img/sabor5.png">

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================
           IMAGENS DOS SABORES
        ===================================== */

        .imagem-bolo {
            display: block;

            width: 100%;
            height: 145px;

            object-fit: contain;
            object-position: center;

            background: transparent;
        }


        /* =====================================
           4º E 5º SABORES CENTRALIZADOS
        ===================================== */

        @media (min-width: 901px) {

            .produto-vitrine:nth-child(4) {
                grid-column: 2;
            }

            .produto-vitrine:nth-child(5) {
                grid-column: 3;
                transform: translateX(-50%);
            }

            .produto-vitrine:nth-child(4) {
                transform: translateX(50%);
            }

        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 600px) {

            .produto-vitrine:nth-child(4),
            .produto-vitrine:nth-child(5) {
                grid-column: auto;
                transform: none;
            }

            .imagem-bolo {
                height: 120px;
            }

        }


        /* =====================================
           CELULARES MUITO ESTREITOS
        ===================================== */

        @media (max-width: 360px) {

            .imagem-bolo {
                height: 115px;
            }

        }


        /* =====================================
           FOTO NA JANELA DE DETALHES
        ===================================== */

        .imagem-janela {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: visible;
        }


        .imagem-detalhes {
            display: block;

            width: 100%;

            max-width: 430px;

            height: min(42vh, 380px);

            margin: 0 auto;

            object-fit: contain;
            object-position: center;

            background: transparent;

            transform: scale(1.3);

            transform-origin: center center;

            transition: transform 0.2s ease;
        }


        /* =====================================
           BRIGADEIRO
           FOTO UM POUCO MENOR
        ===================================== */

        .imagem-detalhes.foto-brigadeiro {
            transform: scale(1.08);
        }


        /* =====================================
           DOCE DE LEITE
           FOTO UM POUCO MENOR
        ===================================== */

        .imagem-detalhes.foto-doce-leite {
            transform: scale(1.08);
        }


        /* =====================================
           JANELA DE DETALHES
           SEM BARRA DE ROLAGEM
        ===================================== */

        .janela-sabor {
            width: min(90vw, 560px) !important;

            max-width: min(90vw, 560px) !important;

            max-height: calc(100dvh - 30px) !important;

            overflow: hidden !important;

            box-sizing: border-box;
        }


        .detalhes-sabor {
            width: 100%;

            max-height: calc(100dvh - 50px) !important;

            overflow: hidden !important;

            box-sizing: border-box;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        /* =====================================
           TÍTULO
        ===================================== */

        #titulo-janela {
            margin-top: 0;

            margin-bottom: 8px;
        }


        /* =====================================
           DESCRIÇÃO
        ===================================== */

        #descricao-janela {
            margin-top: 18px;

            margin-bottom: 14px;

            max-width: 500px;

            min-height: 2.9em;

            line-height: 1.45;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        /* =====================================
           TEXTO PARA FECHAR
        ===================================== */

        .dica-fechar {
            margin-top: 10px;
        }


        /* =====================================
           IMPEDIR ROLAGEM DA PÁGINA
        ===================================== */

        body:has(.janela-sabor[open]) {
            overflow: hidden !important;
        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 600px) {

            .janela-sabor {
                width: 92vw !important;

                max-width: 92vw !important;

                max-height: calc(100dvh - 20px) !important;
            }


            .detalhes-sabor {
                max-height: calc(100dvh - 35px) !important;
            }


            .imagem-detalhes {
                max-width: 330px;

                height: min(34vh, 260px);

                transform: scale(1.25);
            }


            /* Brigadeiro menor no celular */

            .imagem-detalhes.foto-brigadeiro {
                transform: scale(1.05);
            }


            /* Doce de Leite menor no celular */

            .imagem-detalhes.foto-doce-leite {
                transform: scale(1.05);
            }


            #titulo-janela {
                margin-top: 0;

                margin-bottom: 5px;
            }


            #descricao-janela {
                margin-top: 14px;

                margin-bottom: 10px;

                min-height: 2.7em;

                line-height: 1.35;
            }


            .dica-fechar {
                margin-top: 8px;
            }

        }


        /* =====================================
           CELULARES MUITO PEQUENOS
        ===================================== */

        @media (max-width: 360px) {

            .imagem-detalhes {
                max-width: 290px;

                height: min(30vh, 220px);

                transform: scale(1.2);
            }


            /* Brigadeiro menor */

            .imagem-detalhes.foto-brigadeiro {
                transform: scale(1.02);
            }


            /* Doce de Leite menor */

            .imagem-detalhes.foto-doce-leite {
                transform: scale(1.02);
            }


            #descricao-janela {
                font-size: 0.9rem;

                margin-top: 12px;

                margin-bottom: 8px;

                min-height: 2.7em;
            }


            .dica-fechar {
                margin-top: 6px;
            }

        }

    </style>
</head>


<body>

    <div
        class="brilhos brilhos-esquerda"
        aria-hidden="true">
    </div>

    <div
        class="brilhos brilhos-direita"
        aria-hidden="true">
    </div>


    <main class="pagina-cardapio">


        <!-- VOLTAR -->

        <a
            href="index.html"
            class="voltar-inicio"
            aria-label="Voltar à página inicial"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >

                <path d="M19 12H5"></path>

                <path d="m12 19-7-7 7-7"></path>

            </svg>

            <span>
                VOLTAR
            </span>

        </a>


        <!-- CABEÇALHO -->

        <header class="cardapio-apresentacao">

            <div
                class="detalhe-superior"
                aria-hidden="true"
            >

                <span></span>

                <span class="estrela">
                    ✦
                </span>

                <span></span>

            </div>


            <h1 class="titulo-cardapio">
                Nosso cardápio
            </h1>


            <p class="instrucao-cardapio">
                CLIQUE NA FOTO PARA VER OS DETALHES
            </p>

        </header>


        <!-- =====================================
             PRODUTOS
        ====================================== -->

        <section
            class="lista-produtos"
            aria-label="Bolos no pote"
        >


            <!-- SABOR 1 -->

            <button
                class="produto-vitrine"
                type="button"
                data-sabor="Ninho com Morango"
                data-descricao="Massa macia, creme de Ninho e pedaços de morango, criando uma combinação cremosa, delicada e equilibrada."
                data-imagem="img/sabor1.png"
                aria-label="Ver detalhes do Ninho com Morango"
            >

                <span class="imagem-vitrine">

                    <img
                        src="img/sabor1.png"
                        alt="Bolo no pote de Ninho com Morango"
                        class="imagem-bolo"
                        loading="eager"
                        decoding="async"
                        fetchpriority="high"
                    >

                </span>


                <span class="nome-vitrine">
                    Ninho com Morango
                </span>


                <span class="preco-vitrine">
                    R$ 17,90
                </span>

            </button>



            <!-- SABOR 2 -->

            <button
                class="produto-vitrine"
                type="button"
                data-sabor="Ninho com Nutella"
                data-descricao="Massa macia, creme de Ninho e Nutella, unindo a cremosidade do leite em pó ao sabor marcante do creme de avelã."
                data-imagem="img/sabor2.png"
                aria-label="Ver detalhes do Ninho com Nutella"
            >

                <span class="imagem-vitrine">

                    <img
                        src="img/sabor2.png"
                        alt="Bolo no pote de Ninho com Nutella"
                        class="imagem-bolo"
                        loading="eager"
                        decoding="async"
                        fetchpriority="high"
                    >

                </span>


                <span class="nome-vitrine">
                    Ninho com Nutella
                </span>


                <span class="preco-vitrine">
                    R$ 17,90
                </span>

            </button>



            <!-- SABOR 3 -->

            <button
                class="produto-vitrine"
                type="button"
                data-sabor="Brigadeiro"
                data-descricao="Massa de chocolate com recheio cremoso de brigadeiro e uma deliciosa cobertura de chocolate"
                data-imagem="img/sabor3.png"
                aria-label="Ver detalhes do Brigadeiro"
            >

                <span class="imagem-vitrine">

                    <img
                        src="img/sabor3.png"
                        alt="Bolo no pote de Brigadeiro"
                        class="imagem-bolo"
                        loading="eager"
                        decoding="async"
                        fetchpriority="high"
                    >

                </span>


                <span class="nome-vitrine">
                    Brigadeiro
                </span>


                <span class="preco-vitrine">
                    R$ 17,90
                </span>

            </button>



            <!-- SABOR 4 -->

            <button
                class="produto-vitrine"
                type="button"
                data-sabor="Brigadeiro com Morango"
                data-descricao="Massa de chocolate, recheio cremoso de brigadeiro e pedaços de morango, combinando o sabor intenso do chocolate com a leveza da fruta."
                data-imagem="img/sabor4.png"
                aria-label="Ver detalhes do Brigadeiro com Morango"
            >

                <span class="imagem-vitrine">

                    <img
                        src="img/sabor4.png"
                        alt="Bolo no pote de Brigadeiro com Morango"
                        class="imagem-bolo"
                        loading="eager"
                        decoding="async"
                        fetchpriority="high"
                    >

                </span>


                <span class="nome-vitrine">
                    Brigadeiro com Morango
                </span>


                <span class="preco-vitrine">
                    R$ 17,90
                </span>

            </button>



            <!-- SABOR 5 -->

            <button
                class="produto-vitrine"
                type="button"
                data-sabor="Doce de Leite"
                data-descricao="Massa macia com recheio cremoso de doce de leite, trazendo um sabor suave, doce e irresistivelmente cremoso."
                data-imagem="img/sabor5.png"
                aria-label="Ver detalhes do Doce de Leite"
            >

                <span class="imagem-vitrine">

                    <img
                        src="img/sabor5.png"
                        alt="Bolo no pote de Doce de Leite"
                        class="imagem-bolo"
                        loading="eager"
                        decoding="async"
                        fetchpriority="high"
                    >

                </span>


                <span class="nome-vitrine">
                    Doce de Leite
                </span>


                <span class="preco-vitrine">
                    R$ 17,90
                </span>

            </button>


        </section>


        <!-- INSTAGRAM -->

        <div class="area-botao cardapio-area-instagram">

            <a
                href="https://www.instagram.com/goldbolos_/"
                class="botao-cardapio botao-instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Pedir pelo Instagram da Gold Bolos"
            >

                <svg
                    class="icone-instagram"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <rect
                        x="2"
                        y="2"
                        width="20"
                        height="20"
                        rx="5"
                    ></rect>

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>

                    <circle
                        cx="17.5"
                        cy="6.5"
                        r="1"
                        fill="currentColor"
                        stroke="none"
                    ></circle>

                </svg>


                PEDIR PELO INSTAGRAM

            </a>

        </div>

    </main>


    <!-- =====================================
         JANELA DE DETALHES
    ====================================== -->

    <dialog
        class="janela-sabor"
        id="janela-sabor"
        aria-labelledby="titulo-janela"
        aria-describedby="descricao-janela"
    >

        <div class="detalhes-sabor">

            <h2 id="titulo-janela">
                Sabor 1
            </h2>


            <div
                class="imagem-janela"
                aria-hidden="true"
            >

                <img
                    id="imagem-janela-produto"
                    class="imagem-detalhes"
                    src="img/sabor1.png"
                    alt=""
                >

            </div>


            <p id="descricao-janela">
                Descrição do sabor em breve.
            </p>


            <span class="dica-fechar">
                Toque ou clique para fechar
            </span>

        </div>

    </dialog>


    <!-- =====================================
         ATUALIZA FOTO E DETALHES
    ====================================== -->

    <script>

        document.addEventListener(
            "click",
            function (evento) {

                const produto =
                    evento.target.closest(".produto-vitrine");


                if (!produto) {
                    return;
                }


                const imagem =
                    produto.dataset.imagem;


                const nome =
                    produto.dataset.sabor;


                const descricao =
                    produto.dataset.descricao;


                const imagemJanela =
                    document.getElementById(
                        "imagem-janela-produto"
                    );


                const tituloJanela =
                    document.getElementById(
                        "titulo-janela"
                    );


                const descricaoJanela =
                    document.getElementById(
                        "descricao-janela"
                    );


                if (imagemJanela && imagem) {

                    imagemJanela.src = imagem;

                    imagemJanela.alt =
                        "Bolo no pote de " + nome;


                    /* Remove tamanhos especiais anteriores */

                    imagemJanela.classList.remove(
                        "foto-brigadeiro",
                        "foto-doce-leite"
                    );


                    /* Brigadeiro menor */

                    if (nome === "Brigadeiro") {

                        imagemJanela.classList.add(
                            "foto-brigadeiro"
                        );

                    }


                    /* Doce de Leite menor */

                    if (nome === "Doce de Leite") {

                        imagemJanela.classList.add(
                            "foto-doce-leite"
                        );

                    }

                }


                if (tituloJanela && nome) {

                    tituloJanela.textContent =
                        nome;

                }


                if (descricaoJanela && descricao) {

                    descricaoJanela.textContent =
                        descricao;

                }

            },
            true
        );

    </script>


    <script
        src="script.js"
        defer>
    </script>

</body>
</html>
